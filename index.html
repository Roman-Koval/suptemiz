<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#22c55e">
    <title>SupTemiz — Клининг Кипр</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">✨ SupTemiz</div>
            <div class="header-right">
                <select id="langSelect">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="tr">🇹🇷 TR</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button id="themeToggle">🌙</button>
            </div>
        </header>

        <div class="promo">🎉 Первая уборка — 25% скидка новым клиентам!</div>

        <main>
            <!-- ORDER SCREEN -->
            <div id="orderScreen">
                <div class="card">
                    <h3>📍 Район</h3>
                    <select id="district" class="input"></select>
                    <input type="text" id="address" class="input" placeholder="Полный адрес">
                </div>

                <div class="card">
                    <h3>🏠 Комнаты и площадь</h3>
                    <select id="rooms" class="input"></select>
                    <input type="number" id="area" class="input" value="80" placeholder="м²">
                </div>

                <div class="card">
                    <h3>✨ Дополнительно</h3>
                    <div id="extrasContainer"></div>
                </div>

                <div class="card">
                    <h3>📅 Дата и время</h3>
                    <input type="date" id="date" class="input">
                    <select id="time" class="input"></select>
                </div>

                <div class="total-bar">
                    <div>
                        <span>Итого:</span>
                        <span id="totalPrice" class="total">650 ₺</span>
                    </div>
                    <button id="submitOrder" class="btn-order">Оформить + Оплатить</button>
                </div>

                <div class="card">
                    <input type="text" id="userName" class="input" placeholder="Имя">
                    <input type="tel" id="userPhone" class="input" placeholder="+90 ___ ___ __ __">
                    <input type="email" id="userEmail" class="input" placeholder="Email">
                    <button id="saveProfile" class="btn-save">💾 Сохранить профиль</button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-screen="order">📋 Заказ</button>
            <button class="nav-btn" data-screen="gallery">🖼️ Галерея</button>
            <button class="nav-btn" data-screen="history">📜 История</button>
            <button class="nav-btn" data-screen="profile">👤 Профиль</button>
        </nav>

        <button id="adminFab" class="fab">🔧</button>
        <div id="toast" class="toast"></div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
