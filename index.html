<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E7D32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>SupTemiz - Клининг Северный Кипр</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            padding-bottom: 80px;
        }
        .app-container { max-width: 500px; margin: 0 auto; background: #f5f5f5; min-height: 100vh; }
        header {
            background: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 700; }
        .accent { color: #2E7D32; }
        .lang-switcher { display: flex; gap: 8px; }
        .lang-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }
        .lang-btn.active { background: #2E7D32; border-color: #2E7D32; color: white; }
        .promo-banner {
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
            color: white;
            padding: 12px 20px;
            margin: 12px;
            border-radius: 12px;
        }
        .main-nav {
            display: flex;
            background: white;
            margin: 12px;
            border-radius: 16px;
            padding: 4px;
            gap: 4px;
        }
        .nav-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .nav-tab.active { background: #2E7D32; color: white; }
        .tab-content { display: none; padding: 0 12px; }
        .tab-content.active { display: block; }
        .card {
            background: white;
            margin: 12px 0;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-select, .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-top: 8px;
        }
        .service-option {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f9f9f9;
            border-radius: 12px;
            cursor: pointer;
        }
        .service-option input { margin-right: 12px; }
        .price { float: right; color: #2E7D32; font-weight: 700; }
        .extra-option { display: block; padding: 10px 0; cursor: pointer; }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 12px 0;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #e0e0e0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .history-item {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .empty-state { text-align: center; padding: 48px; color: #999; }
        .avatar { font-size: 64px; text-align: center; margin-bottom: 20px; }
        
        /* Модальное окно регистрации */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 16px; color: #2E7D32; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        .modal-content button {
            width: 100%;
            padding: 14px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 16px;
            cursor: pointer;
        }
        .modal-close {
            margin-top: 12px;
            background: #999 !important;
        }
        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast-message.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">✨ Sup<span class="accent">Temiz</span></div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="tr">TR</button>
            </div>
        </header>

        <div class="promo-banner">🎉 Первая уборка со скидкой 20%</div>

        <nav class="main-nav">
            <button class="nav-tab active" data-tab="order">📋 Заказ</button>
            <button class="nav-tab" data-tab="history">📜 История</button>
            <button class="nav-tab" data-tab="profile">👤 Профиль</button>
        </nav>

        <!-- Заказ -->
        <div id="order-tab" class="tab-content active">
            <div class="card">
                <h3>📍 Ваш район</h3>
                <select id="district" class="form-select">
                    <option value="lefkosa">Лефкоша (Никосия)</option>
                    <option value="girne" selected>Гирне (Кирения)</option>
                    <option value="gazimagusa">Газимагуса (Фамагуста)</option>
                    <option value="iskele">Искеле (Трикомо)</option>
                    <option value="guzelyurt">Гюзельюрт (Морфу)</option>
                </select>
                <input type="text" id="address" placeholder="Улица, дом, квартира" class="form-input">
            </div>

            <div class="card">
                <h3>🧹 Тип уборки</h3>
                <label class="service-option"><input type="radio" name="service" value="standard" checked> Стандартная <span class="price">500 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="general"> Генеральная <span class="price">950 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="after_repair"> После ремонта <span class="price">1800 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="office"> Офисная <span class="price">700 ₺</span></label>
            </div>

            <div class="card">
                <h3>✨ Дополнительно</h3>
                <label class="extra-option"><input type="checkbox" id="extra_ac"> Чистка кондиционера <span class="price">+200 ₺</span></label>
                <label class="extra-option"><input type="checkbox" id="extra_window"> Мойка окон <span class="price">+150 ₺</span></label>
                <label class="extra-option"><input type="checkbox" id="extra_fridge"> Чистка холодильника <span class="price">+100 ₺</span></label>
            </div>

            <div class="card">
                <h3>📅 Дата и время</h3>
                <input type="date" id="date" class="form-input">
                <select id="time" class="form-select">
                    <option>09:00 - 12:00</option>
                    <option>12:00 - 15:00</option>
                    <option>15:00 - 18:00</option>
                    <option>18:00 - 21:00</option>
                </select>
            </div>

            <div class="card">
                <h3>💰 Итого: <span id="totalPrice" style="color:#2E7D32;">500 ₺</span></h3>
            </div>

            <button class="btn-primary" id="orderBtn">📞 Оформить заказ</button>
        </div>

        <!-- История -->
        <div id="history-tab" class="tab-content">
            <div id="historyList" class="history-list">
                <div class="empty-state">📭 Нет заказов</div>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profile-tab" class="tab-content">
            <div class="card">
                <div class="avatar">👤</div>
                <input type="text" id="userName" placeholder="Ваше имя" class="form-input">
                <input type="tel" id="userPhone" placeholder="Телефон" class="form-input">
                <input type="email" id="userEmail" placeholder="Email" class="form-input">
                <button class="btn-secondary" id="saveProfileBtn">💾 Сохранить профиль</button>
            </div>
            <div class="card">
                <h4>📞 Контакты</h4>
                <p>WhatsApp: +90 533 888 88 88</p>
                <p>Telegram: @suptemiz_bot</p>
            </div>
        </div>
    </div>

    <!-- Модальное окно регистрации -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h3>📝 Заполните профиль</h3>
            <p style="margin-bottom: 16px; color: #666;">Для оформления заказа нужны ваши контакты</p>
            <input type="text" id="modalName" placeholder="Ваше имя">
            <input type="tel" id="modalPhone" placeholder="Телефон">
            <button id="modalSaveBtn">Сохранить и продолжить</button>
            <button class="modal-close" id="modalCloseBtn">Отмена</button>
        </div>
    </div>

    <div id="toast" class="toast-message"></div>

    <script>
        // Telegram настройки
        const BOT_TOKEN = '8776328263:AANez7565yh4XyI8stLj6efMOP9QGMAvGH8';
        const CHAT_ID = '897174464';

        let pendingOrder = null; // Для временного хранения заказа

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function calculateTotal() {
            let total = 500;
            const service = document.querySelector('input[name="service"]:checked').value;
            if (service === 'general') total = 950;
            if (service === 'after_repair') total = 1800;
            if (service === 'office') total = 700;
            if (document.getElementById('extra_ac').checked) total += 200;
            if (document.getElementById('extra_window').checked) total += 150;
            if (document.getElementById('extra_fridge').checked) total += 100;
            document.getElementById('totalPrice').innerText = total + ' ₺';
            return total;
        }

        function showRegisterModal(callback) {
            const modal = document.getElementById('registerModal');
            const modalName = document.getElementById('modalName');
            const modalPhone = document.getElementById('modalPhone');
            
            modalName.value = localStorage.getItem('userName') || '';
            modalPhone.value = localStorage.getItem('userPhone') || '';
            
            modal.classList.add('active');
            
            const saveBtn = document.getElementById('modalSaveBtn');
            const closeBtn = document.getElementById('modalCloseBtn');
            
            const handler = () => {
                const name = modalName.value.trim();
                const phone = modalPhone.value.trim();
                if (name && phone) {
                    localStorage.setItem('userName', name);
                    localStorage.setItem('userPhone', phone);
                    modal.classList.remove('active');
                    if (callback) callback();
                } else {
                    showToast('Заполните имя и телефон');
                }
            };
            
            const closeHandler = () => {
                modal.classList.remove('active');
                saveBtn.removeEventListener('click', handler);
                closeBtn.removeEventListener('click', closeHandler);
            };
            
            saveBtn.onclick = handler;
            closeBtn.onclick = closeHandler;
        }

        function saveOrder() {
            const name = localStorage.getItem('userName');
            const phone = localStorage.getItem('userPhone');
            const address = document.getElementById('address').value;
            
            if (!address) {
                showToast('Укажите адрес');
                return;
            }
            
            if (!name || !phone) {
                // Показываем форму регистрации
                showRegisterModal(() => {
                    saveOrder(); // повторяем попытку после сохранения
                });
                return;
            }
            
            const order = {
                id: Date.now(),
                date: new Date().toISOString(),
                address: address,
                district: document.getElementById('district').options[document.getElementById('district').selectedIndex].text,
                service: document.querySelector('input[name="service"]:checked').parentElement.innerText.split('₺')[0].trim(),
                extras: getExtras(),
                orderDate: document.getElementById('date').value,
                orderTime: document.getElementById('time').value,
                total: calculateTotal(),
                status: 'Ожидает подтверждения',
                userName: name,
                userPhone: phone
            };
            
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.unshift(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            
            // Отправка в Telegram
            const msg = `🚨 НОВЫЙ ЗАКАЗ SupTemiz!
━━━━━━━━━━━━━━━━━━━━━
👤 ${order.userName}
📞 ${order.userPhone}
📍 ${order.district}
🏠 ${order.address}
🧹 ${order.service}
✨ ${order.extras}
💰 ${order.total} ₺
━━━━━━━━━━━━━━━━━━━━━`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`)
                .catch(e => console.log('Telegram error:', e));
            
            showToast('✅ Заказ оформлен!');
            loadHistory();
            
            // Очистка формы
            document.getElementById('address').value = '';
            document.getElementById('extra_ac').checked = false;
            document.getElementById('extra_window').checked = false;
            document.getElementById('extra_fridge').checked = false;
        }

        function getExtras() {
            const extras = [];
            if (document.getElementById('extra_ac').checked) extras.push('Кондиционер');
            if (document.getElementById('extra_window').checked) extras.push('Окна');
            if (document.getElementById('extra_fridge').checked) extras.push('Холодильник');
            return extras.join(', ') || 'Нет';
        }

        function loadHistory() {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const container = document.getElementById('historyList');
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Нет заказов</div>';
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="history-item">
                    <strong>${new Date(o.date).toLocaleDateString()}</strong><br>
                    ${o.service} • ${o.total} ₺<br>
                    <small>${o.address} • ${o.status}</small>
                </div>
            `).join('');
        }

        function loadProfile() {
            document.getElementById('userName').value = localStorage.getItem('userName') || '';
            document.getElementById('userPhone').value = localStorage.getItem('userPhone') || '';
            document.getElementById('userEmail').value = localStorage.getItem('userEmail') || '';
        }

        function saveProfile() {
            localStorage.setItem('userName', document.getElementById('userName').value);
            localStorage.setItem('userPhone', document.getElementById('userPhone').value);
            localStorage.setItem('userEmail', document.getElementById('userEmail').value);
            showToast('✅ Профиль сохранён!');
        }

        // Вкладки
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
                if (tab.dataset.tab === 'history') loadHistory();
                if (tab.dataset.tab === 'profile') loadProfile();
            };
        });

        // Слушатели
        document.querySelectorAll('input[name="service"], #extra_ac, #extra_window, #extra_fridge').forEach(el => {
            el.onchange = calculateTotal;
        });
        document.getElementById('orderBtn').onclick = saveOrder;
        document.getElementById('saveProfileBtn').onclick = saveProfile;
        
        // Инициализация
        calculateTotal();
        loadHistory();
        loadProfile();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
