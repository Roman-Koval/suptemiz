<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#22c55e">
    <title>SupTemiz — Клининг Северного Кипра</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">✨ Sup<span class="accent">Temiz</span></div>
            <div class="header-controls">
                <select id="langSelect" class="lang-select"></select>
                <button id="themeToggle" class="icon-btn">🌙</button>
            </div>
        </header>

        <div class="promo-banner glass">🎉 Первая уборка — 25% скидка!</div>

        <nav class="bottom-nav glass">
            <button class="nav-btn active" data-tab="order">📋<span>Заказ</span></button>
            <button class="nav-btn" data-tab="gallery">🖼️<span>Галерея</span></button>
            <button class="nav-btn" data-tab="history">📜<span>История</span></button>
            <button class="nav-btn" data-tab="profile">👤<span>Профиль</span></button>
        </nav>

        <!-- ORDER TAB -->
        <div id="order-tab" class="tab-content active"> ... (оставь как в предыдущей версии) </div>

        <!-- GALLERY TAB -->
        <div id="gallery-tab" class="tab-content">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <!-- HISTORY TAB -->
        <div id="history-tab" class="tab-content">
            <div id="historyList"></div>
        </div>

        <!-- PROFILE TAB -->
        <div id="profile-tab" class="tab-content">
            <div class="card glass">
                <input type="text" id="userName" class="input" placeholder="Имя">
                <input type="tel" id="userPhone" class="input" placeholder="+90">
                <input type="email" id="userEmail" class="input" placeholder="Email">
                <button id="saveProfileBtn" class="btn-primary">Сохранить</button>
            </div>
            <button id="adminBtn" class="btn-secondary" style="margin:12px;">🔧 Админ-панель</button>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal" class="modal">
        <div class="modal-content glass">
            <h2>Админ-панель</h2>
            <div id="adminOrdersList"></div>
            <button id="closeAdmin">Закрыть</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="adminFab" class="admin-fab">🔧</div>

    <script src="app.js" defer></script>
</body>
</html>
