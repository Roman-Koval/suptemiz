<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E7D32">
    <title>SupTemiz — Клининг Северного Кипра</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="logo">✨ Sup<span class="accent">Temiz</span></div>
            <div class="header-controls">
                <select id="langSelect" class="lang-select">
                    <option value="ru">🇷🇺 RU</option>
                    <option value="tr">🇹🇷 TR</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button id="themeToggle" class="icon-btn">🌙</button>
            </div>
        </header>

        <div class="promo-banner glass">🎉 Первая уборка — скидка 25% для новых клиентов!</div>

        <nav class="bottom-nav glass">
            <button class="nav-btn active" data-tab="order">📋<span>Заказ</span></button>
            <button class="nav-btn" data-tab="history">📜<span>История</span></button>
            <button class="nav-btn" data-tab="profile">👤<span>Профиль</span></button>
        </nav>

        <!-- TAB: ORDER -->
        <div id="order-tab" class="tab-content active">
            <div class="card glass">
                <h3 data-lang="district">📍 Ваш район</h3>
                <select id="district" class="input"></select>
                <input type="text" id="address" class="input" placeholder="Полный адрес">
            </div>

            <div class="card glass">
                <h3 data-lang="rooms">🏠 Количество комнат + площадь</h3>
                <div class="flex-row">
                    <select id="rooms" class="input"></select>
                    <input type="number" id="area" class="input" placeholder="м²" min="30">
                </div>
            </div>

            <div class="card glass">
                <h3 data-lang="service_type">🧹 Тип уборки</h3>
                <!-- service options with radio -->
                <div id="serviceOptions" class="grid-options"></div>
            </div>

            <div class="card glass">
                <h3 data-lang="extras">✨ Дополнительные услуги</h3>
                <div id="extrasContainer" class="extras-grid"></div>
            </div>

            <div class="card glass">
                <h3 data-lang="datetime">📅 Дата и время</h3>
                <input type="date" id="date" class="input">
                <select id="time" class="input"></select>
            </div>

            <div class="total-bar glass">
                <div>Итого: <span id="totalPrice" class="total">650 ₺</span></div>
                <button id="orderBtn" class="btn-primary">Оформить заказ</button>
            </div>
        </div>

        <!-- TAB: HISTORY -->
        <div id="history-tab" class="tab-content">
            <div id="historyList" class="list-container"></div>
        </div>

        <!-- TAB: PROFILE -->
        <div id="profile-tab" class="tab-content">
            <!-- Profile card + admin button -->
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="adminPanel" class="modal">...</div>

    <script src="app.js" defer></script>
</body>
</html>
