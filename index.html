<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E7D32">
    <title>SupTemiz — Клининг Северного Кипра</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">✨ Sup<span class="accent">Temiz</span></div>
            <div class="header-right">
                <span class="role-badge" id="roleBadge">👤 Клиент</span>
                <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
            </div>
        </header>

        <div class="promo-banner">🎉 Первая уборка со скидкой 20%</div>
        <div class="sync-status" id="syncStatus">🟢 Онлайн синхронизация</div>

        <nav class="main-nav">
            <button class="nav-tab active" data-tab="order">📋 Заказ</button>
            <button class="nav-tab" data-tab="history">📜 История</button>
            <button class="nav-tab" data-tab="profile">👤 Профиль</button>
        </nav>

        <!-- Вкладка Заказ -->
        <div id="order-tab" class="tab-content active">
            <!-- Карточки будут стилизованы через CSS -->
            <div class="card">
                <h3>📍 Ваш район</h3>
                <select id="district" class="form-select">
                    <option value="lefkosa">Лефкоша (Никосия)</option>
                    <option value="girne" selected>Гирне (Кирения)</option>
                    <option value="gazimagusa">Газимагуса (Фамагуста)</option>
                    <option value="iskele">Искеле</option>
                    <option value="guzelyurt">Гюзельюрт</option>
                </select>
                <input type="text" id="address" placeholder="Улица, дом, квартира" class="form-input">
            </div>

            <div class="card">
                <h3>🧹 Тип уборки</h3>
                <div class="service-grid">
                    <label class="service-option">
                        <input type="radio" name="service" value="standard" checked>
                        <div class="service-info"><strong>Стандартная</strong><small>1-2 комнаты</small></div>
                        <span class="price">500 ₺</span>
                    </label>
                    <label class="service-option">
                        <input type="radio" name="service" value="general">
                        <div class="service-info"><strong>Генеральная</strong></div>
                        <span class="price">950 ₺</span>
                    </label>
                    <label class="service-option">
                        <input type="radio" name="service" value="after_repair">
                        <div class="service-info"><strong>После ремонта</strong></div>
                        <span class="price">1800 ₺</span>
                    </label>
                    <label class="service-option">
                        <input type="radio" name="service" value="office">
                        <div class="service-info"><strong>Офисная</strong></div>
                        <span class="price">700 ₺</span>
                    </label>
                </div>
            </div>

            <div class="card">
                <h3>✨ Дополнительно</h3>
                <label class="extra-option">
                    <input type="checkbox" id="extra_ac"> Чистка кондиционера <span class="price">+200 ₺</span>
                </label>
                <label class="extra-option">
                    <input type="checkbox" id="extra_window"> Мойка окон <span class="price">+150 ₺</span>
                </label>
                <label class="extra-option">
                    <input type="checkbox" id="extra_fridge"> Чистка холодильника <span class="price">+100 ₺</span>
                </label>
            </div>

            <div class="card">
                <h3>📅 Дата и время</h3>
                <input type="date" id="date" class="form-input">
                <select id="time" class="form-select">
                    <option>09:00 - 12:00</option>
                    <option>12:00 - 15:00</option>
                    <option>15:00 - 18:00</option>
                    <option>18:00 - 21:00</option>
                </select>
            </div>

            <div class="card total-card">
                <div class="total-row">
                    <span>Итого:</span>
                    <span id="totalPrice" class="total-price">500 ₺</span>
                </div>
            </div>

            <button class="btn-primary" id="orderBtn">📞 Оформить заказ</button>
        </div>

        <!-- История -->
        <div id="history-tab" class="tab-content">
            <div id="historyList" class="history-list"></div>
        </div>

        <!-- Профиль -->
        <div id="profile-tab" class="tab-content">
            <div class="card">
                <div class="avatar">👤</div>
                <input type="text" id="userName" placeholder="Ваше имя" class="form-input">
                <input type="tel" id="userPhone" placeholder="Телефон (+90 ...)" class="form-input">
                <input type="email" id="userEmail" placeholder="Email (необязательно)" class="form-input">
                <button class="btn-secondary" id="saveProfileBtn">💾 Сохранить профиль</button>
            </div>
            <div class="card">
                <h4>📞 Контакты поддержки</h4>
                <p>WhatsApp: +90 533 888 88 88</p>
            </div>
        </div>
    </div>

    <!-- Модальные окна и Toast -->
    <div id="registerModal" class="modal">...</div> <!-- можешь оставить как было или упростить -->
    <div id="adminModal" class="modal">...</div>
    <div id="toast" class="toast-message"></div>
    <div id="adminFab" class="admin-fab" style="display: none;">🔧</div>

    <script src="app.js" defer></script>
</body>
</html>
