<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2E7D32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SupTemiz — Клининг Северного Кипра</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">✨ Sup<span class="accent">Temiz</span></div>
            <div class="header-right">
                <select id="langSelect" class="lang-select">
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="tr">🇹🇷 Türkçe</option>
                </select>
                <span class="role-badge" id="roleBadge">👤 Клиент</span>
                <button class="theme-toggle" id="themeToggle" aria-label="Тема">🌙</button>
            </div>
        </header>

        <div class="promo-banner" id="promoBanner">🎉 Первая уборка — 25% скидка новым клиентам!</div>
        <div class="sync-status" id="syncStatus">🟢 Онлайн синхронизация</div>

        <!-- Динамическая навигация -->
        <nav class="main-nav" id="mainNav"></nav>

        <!-- Вкладка Заказ (только для клиента) -->
        <div id="order-tab" class="tab-content">
            <div class="card">
                <h3>📍 Район</h3>
                <select id="district" class="form-select">
                    <option value="lefkosa">Лефкоша (Никосия)</option>
                    <option value="girne" selected>Гирне (Кирения)</option>
                    <option value="gazimagusa">Газимагуса (Фамагуста)</option>
                    <option value="iskele">Искеле (Трикомо)</option>
                    <option value="guzelyurt">Гюзельюрт (Морфу)</option>
                </select>
                <input type="text" id="address" placeholder="Улица, дом, квартира" class="form-input">
            </div>
            <div class="card">
                <h3>🧹 Тип уборки</h3>
                <label class="service-option"><input type="radio" name="service" value="standard" checked> Стандартная <span class="price">500 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="general"> Генеральная <span class="price">950 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="after_repair"> После ремонта <span class="price">1800 ₺</span></label>
                <label class="service-option"><input type="radio" name="service" value="office"> Офисная <span class="price">700 ₺</span></label>
            </div>
            <div class="card">
                <h3>📏 Детали помещения</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Комнат</label>
                        <input type="number" id="rooms" class="form-input" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label>Площадь (м²)</label>
                        <input type="number" id="area" class="form-input" min="10" value="50">
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>✨ Дополнительно</h3>
                <label class="extra-option"><input type="checkbox" id="extra_ac"> Чистка кондиционера <span class="price">+200 ₺</span></label>
                <label class="extra-option"><input type="checkbox" id="extra_window"> Мойка окон <span class="price">+150 ₺</span></label>
                <label class="extra-option"><input type="checkbox" id="extra_fridge"> Чистка холодильника <span class="price">+100 ₺</span></label>
            </div>
            <div class="card">
                <h3>📅 Дата и время</h3>
                <input type="date" id="date" class="form-input">
                <select id="time" class="form-select">
                    <option>09:00 - 12:00</option><option>12:00 - 15:00</option>
                    <option>15:00 - 18:00</option><option>18:00 - 21:00</option>
                </select>
            </div>
            <div class="card">
                <h3>💰 Итого: <span id="totalPrice">500 ₺</span></h3>
                <div id="discountInfo" style="font-size:12px; color:#888; margin-top:5px;"></div>
            </div>
            <button class="btn-primary" id="orderBtn">📞 Оформить + Оплатить</button>
        </div>

        <!-- Вкладка История/Заказы (для клиента показывает его заказы, для админа/клинера — все) -->
        <div id="history-tab" class="tab-content">
            <div id="historyList" class="history-list"><div class="empty-state">📭 Нет заказов</div></div>
        </div>

        <!-- Вкладка Профиль -->
        <div id="profile-tab" class="tab-content">
            <div class="card">
                <div class="avatar">👤</div>
                <input type="text" id="userName" placeholder="Имя" class="form-input">
                <input type="tel" id="userPhone" placeholder="+90 ___ ___ __ __" class="form-input" maxlength="17">
                <input type="email" id="userEmail" placeholder="Email" class="form-input">
                <button class="btn-secondary" id="saveProfileBtn">💾 Сохранить профиль</button>
            </div>
            <div class="card"><h4>📞 Контакты поддержки</h4><p>WhatsApp: +90 533 888 88 88</p></div>
        </div>
    </div>

    <!-- Модалка регистрации -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <button class="modal-close-icon" onclick="closeModal('registerModal')">✕</button>
            <h3>📝 Заполните профиль</h3>
            <input type="text" id="modalName" placeholder="Имя">
            <input type="tel" id="modalPhone" placeholder="Телефон +90...">
            <input type="email" id="modalEmail" placeholder="Email">
            <button id="modalSaveBtn">Сохранить и продолжить</button>
            <button id="modalCloseBtn" class="modal-close">Отмена</button>
        </div>
    </div>

    <!-- Админ FAB (только для админа/клинера) -->
    <div id="adminFab" class="admin-fab" style="display: none;">🔧</div>

    <div id="toast" class="toast-message"></div>

    <script src="app.js"></script>
</body>
</html>
