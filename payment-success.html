<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна - TemizYap</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            margin: 0;
            padding: 20px;
        }
        .success-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .checkmark {
            font-size: 80px;
            animation: bounce 0.5s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        button {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="checkmark">✅</div>
        <h1>Оплата прошла успешно!</h1>
        <p>Ваш заказ принят. Мы свяжемся с вами в ближайшее время.</p>
        <p>Номер заказа: <strong id="orderId"></strong></p>
        <button onclick="goHome()">Вернуться в приложение</button>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        document.getElementById('orderId').textContent = orderId;
        
        // Сохраняем подтверждённый заказ
        if(orderId) {
            const pendingOrder = localStorage.getItem(`pending_order_${orderId}`);
            if(pendingOrder) {
                const order = JSON.parse(pendingOrder);
                order.status = 'Оплачен, ожидает выполнения';
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                orders.unshift(order);
                localStorage.setItem('orders', JSON.stringify(orders));
                localStorage.removeItem(`pending_order_${orderId}`);
            }
        }
        
        function goHome() {
            window.location.href = '/';
        }
        
        // Автоматический возврат через 5 секунд
        setTimeout(goHome, 5000);
    </script>
</body>
</html>
