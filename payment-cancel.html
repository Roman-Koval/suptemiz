<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата отменена - TemizYap</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffebee;
            margin: 0;
            padding: 20px;
        }
        .cancel-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        button {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="cancel-card">
        <div style="font-size: 80px;">❌</div>
        <h1>Оплата не прошла</h1>
        <p>Вы отменили оплату или произошла ошибка.</p>
        <p>Попробуйте снова или выберите оплату наличными.</p>
        <button onclick="goHome()">Вернуться и попробовать снова</button>
    </div>
    <script>
        function goHome() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
